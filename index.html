<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="icon" href="img/favicon.webp" type="image/webp"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>CRUD</title>
</head>
<body>
    <h1 style="text-align: center;">CRUD</h1>

    <div class="colunas">
        <div class="coluna">
            <h3>Cadastrar Usuário</h3>
            <form id="formularioEnviar">
                <label>Nome: </label>
                <input type="text" id="nome" placeholder="Seu nome"><br><br>

                <label>Idade: </label>
                <input type="text" id="idade" placeholder="Sua idade"><br><br>

                <input type="submit" value="Enviar"><br><br>
            </form>
        </div>

        <div class="coluna">
            <h3>Pesquisar Usuário</h3>
            <form id="formularioPesquisar">
                <label>Pesquisar por nome: </label>
                <input type="text" id="pesquisar" placeholder="Pedro, João..."><br><br>

                <input type="submit" value="Pesquisar"><br><br>
            </form>
            <h2 id="resultadoPesquisar"></h2>
        </div>

        <div class="coluna">
            <h3>Excluir Usuário</h3>
            <form id="formularioExcluir">
                <label>Excluir por nome: </label>
                <input type="text" id="excluir" placeholder="Pedro, João..."><br><br>

                <input type="submit" value="Excluir"><br><br>
            </form>
        </div>

        <div class="coluna">
            <h3>Editar Usuário</h3>
            <form id="formularioEditar">
                <label>Nome já cadastrado: </label>
                <input type="text" id="nomeEditar" placeholder="Pedro, João..."><br><br>

                <label>Novo nome: </label>
                <input type="text" id="alterar" placeholder="Novo nome"><br><br>

                <label>Nova idade: </label>
                <input type="text" id="idadeEditar" placeholder="Nova idade"><br><br>

                <input type="submit" value="Alterar">
            </form>
        </div>
    </div>
</body>
